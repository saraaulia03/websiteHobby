    <link rel="stylesheet" href="style.css">
    <style>
        /* Styling khusus galeri agar foto lebih menonjol */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 1.5rem;
        }
        .gallery-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        .gallery-item img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }
        .gallery-item .caption {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
