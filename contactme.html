    <main>
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Contact Mee</h2>
        <form>
            <div class="form-group">
                <label for="name">Nama:</label>
                <input type="text" id="name" placeholder="Masukkan nama kamu" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Masukkan email kamu" required>
            </div>
            <div class="form-group">
                <label for="message">Pesan:</label>
                <textarea id="message" rows="5" placeholder="Tulis pendapat kamu tentang hobby ku..." required></textarea>
            </div>
            <button type="submit">Kirim Pesan</button>
        </form>
    </main>
